[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myquant-mcp"
version = "0.1.0"
description = "MCP server exposing MyQuant (掘金量化) market data through a running GM Terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "徐志兴" }]
keywords = ["mcp", "myquant", "quant", "market-data", "kline", "china-stock"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2,<2",
    "gm>=3.0.190",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/Leaderxin/myquant-mcp"
Issues = "https://github.com/Leaderxin/myquant-mcp/issues"

[project.scripts]
myquant-mcp = "server:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
